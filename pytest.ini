[pytest]
# 测试目录。**不要**同时在命令行传 tests/ —— 两者叠加会导致收集异常。
testpaths = tests

# pytest-asyncio：自动识别 async 测试，无需逐个加 @pytest.mark.asyncio
asyncio_mode = auto

# 输出
addopts = -q --strict-markers
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 自定义 marker
#   integration —— 需要真实网络/服务（默认不跑，RUN_LIVE=1 才启用）
#                  见 tests/test_ux.py（用户视角测试）
markers =
    integration: 需要真实网络的用户视角测试（RUN_LIVE=1）

# 过滤警告（httpx 的 deprecation 噪声会淹没真正的告警）
filterwarnings =
    ignore::DeprecationWarning
